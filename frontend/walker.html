<!DOCTYPE html>
<html>
<head>
  <title>Walker</title>

  <!-- Leaflet -->
  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    #map { height: 400px; margin-top: 15px; }
    button {
      padding: 10px;
      font-size: 16px;
      margin-right: 10px;
    }
  </style>
</head>

<body>
  <h2>🚶 Walker</h2>

  <p>Walk ID: <strong id="walkId"></strong></p>

  <button onclick="startWalk()">▶ Start Walk</button>
  <button onclick="stopWalk()">⏹ Stop Walk</button>

  <div id="status">Waiting to start</div>

  <div id="map"></div>

  <script>
    const walkId = Math.random().toString(36).substring(2, 8).toUpperCase();
    document.getElementById("walkId").innerText = walkId;

    const protocol = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${protocol}://${location.host}/ws`);

    let map, marker;
    let walkActive = false;

    ws.onopen = () => {
      ws.send(JSON.stringify({
        type: "register",
        role: "walker",
        walk_id: walkId
      }));
    };

    function startWalk() {
      walkActive = true;
      document.getElementById("status").innerText = "🟢 Walk started";
    }

    function stopWalk() {
      walkActive = false;
      document.getElementById("status").innerText = "🔴 Walk stopped";
    }

    navigator.geolocation.watchPosition(pos => {
      const { latitude, longitude } = pos.coords;

      if (!map) {
        map = L.map("map").setView([latitude, longitude], 16);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: "© OpenStreetMap"
        }).addTo(map);

        marker = L.marker([latitude, longitude]).addTo(map);
      } else {
        marker.setLatLng([latitude, longitude]);
        map.panTo([latitude, longitude]);
      }

      // 🔥 Only send location if walk is active
      if (walkActive && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: "location",
          walk_id: walkId,
          lat: latitude,
          lng: longitude
        }));
      }
    });
  </script>
</body>
</html>
