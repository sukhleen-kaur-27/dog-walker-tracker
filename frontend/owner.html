<!DOCTYPE html>
<html>
<head>
  <title>Owner</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="/static/styles.css" />
</head>

<body>
  <div class="container">
    <h2>🐶 Owner View</h2>

    <label>
      Enter Walk ID:
      <input id="walkIdInput" />
    </label>
    <button onclick="connect()" class="btn primary">Connect</button>

    <div id="walkState" class="stats">
      ⏸ Waiting for walk to start
    </div>

    <div class="stats">
      Distance: <span id="distance">0</span> meters
    </div>

    <div class="stats">
      Duration: <span id="duration">0</span> seconds
    </div>

    <div id="map" class="map"></div>
  </div>

  <script>
    let ws;
    let map, marker, polyline;

    let path = [];
    let totalDistance = 0;

    let startTime = null;
    let durationTimer = null;
    let walkActive = false;

    function connect() {
      const walkId = document.getElementById("walkIdInput").value.trim();
      if (!walkId) {
        alert("Enter Walk ID");
        return;
      }

      resetState();

      const protocol = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${protocol}://${location.host}/ws`);

      ws.onopen = () => {
        ws.send(JSON.stringify({
          type: "register",
          role: "owner",
          walk_id: walkId
        }));
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        console.log("Owner received:", data);

        // ---------------- STATUS ---------------- 
        if (data.type === "status") {
          if (data.state === "started") {
            walkActive = true;
            startTime = Date.now();
            startDurationTimer();
            document.getElementById("walkState").innerText = "🟢 Walk in progress";
            console.log("Walk started, timer started");
          }

          if (data.state === "stopped") {
            walkActive = false;
            stopDurationTimer();
            document.getElementById("walkState").innerText = "🔴 Walk stopped";
          }
          return;
        }

        // ---------------- LOCATION ---------------- 
        if (data.type === "location") {
          console.log("Owner received location:", data.lat, data.lng);
          handleLocation(data.lat, data.lng);
        }
      };

      ws.onclose = () => {
        stopDurationTimer();
        document.getElementById("walkState").innerText = "🔴 Walk ended";
      };
    }

    function resetState() {
      path = [];
      totalDistance = 0;
      startTime = null;
      walkActive = false;

      document.getElementById("distance").innerText = "0";
      document.getElementById("duration").innerText = "0";

      if (map) {
        map.remove();
        map = null;
      }
    }

    // ---------------- LOCATION HANDLING ---------------- 
    function handleLocation(lat, lng) {
      if (lat == null || lng == null) {
        console.log("Invalid location data:", lat, lng);
        return;
      }

      const latlng = [lat, lng];

      // If we receive a location update but walk isn't marked as active,
      // it means owner connected after walk started - start the timer now
      if (!walkActive && !durationTimer) {
        console.log("Received location but walk not active - starting timer now");
        walkActive = true;
        startTime = Date.now();
        startDurationTimer();
        document.getElementById("walkState").innerText = "🟢 Walk in progress";
      }

      if (!map) {
        map = L.map("map").setView(latlng, 16);
        L.tileLayer(
          "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
          { attribution: "© OpenStreetMap" }
        ).addTo(map);

        marker = L.marker(latlng).addTo(map);
        polyline = L.polyline([latlng], { color: "blue" }).addTo(map);
      } else {
        marker.setLatLng(latlng);
        polyline.addLatLng(latlng);
        map.panTo(latlng);
      }

      if (path.length > 0) {
        const distanceIncrement = haversine(path[path.length - 1], latlng);
        totalDistance += distanceIncrement;
        document.getElementById("distance").innerText =
          totalDistance.toFixed(2);
        console.log(`Distance updated: +${distanceIncrement.toFixed(2)}m, total: ${totalDistance.toFixed(2)}m`);
      } else {
        console.log("First location received, initializing path");
      }

      path.push(latlng);
    }

    // ---------------- TIMER ----------------
    function startDurationTimer() {
      if (durationTimer) return;

      durationTimer = setInterval(() => {
        const seconds = Math.floor((Date.now() - startTime) / 1000);
        document.getElementById("duration").innerText = seconds;
      }, 1000);
    }

    function stopDurationTimer() {
      if (durationTimer) {
        clearInterval(durationTimer);
        durationTimer = null;
      }
    }

    // ---------------- DISTANCE ----------------
    function haversine(a, b) {
      const R = 6371000;
      const toRad = (x) => (x * Math.PI) / 180;

      const dLat = toRad(b[0] - a[0]);
      const dLng = toRad(b[1] - a[1]);

      const lat1 = toRad(a[0]);
      const lat2 = toRad(b[0]);

      const h =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1) *
          Math.cos(lat2) *
          Math.sin(dLng / 2) ** 2;

      return 2 * R * Math.asin(Math.sqrt(h));
    }
  </script>
</body>
</html>
