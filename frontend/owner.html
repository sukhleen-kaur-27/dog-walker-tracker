<!DOCTYPE html>
<html>
<head>
  <title>Owner</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="/static/styles.css" />
</head>

<body>
  <div class="container">
    <h2>🐶 Owner View</h2>

    <label>
      Enter Walk ID:
      <input id="walkIdInput" />
    </label>
    <button onclick="connect()" class="btn primary">Connect</button>

    <div id="walkState" class="stats">
      ⏸ Waiting for walk to start
    </div>

    <div class="stats">
      Distance: <span id="distance">0</span> meters
    </div>
    <div class="stats">
      Duration: <span id="duration">0</span> seconds
    </div>

    <div id="map" class="map"></div>
  </div>

  <script>
    let ws;
    let map, marker, polyline;
    let path = [];
    let totalDistance = 0;
    let startTime = null;
    let durationTimer = null;

    function connect() {
      const walkId = document.getElementById("walkIdInput").value.trim();
      if (!walkId) {
        alert("Enter Walk ID");
        return;
      }

      const protocol = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${protocol}://${location.host}/ws`);

      ws.onopen = () => {
        ws.send(JSON.stringify({
          type: "register",
          role: "owner",
          walk_id: walkId
        }));
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        // 🔒 Only handle location messages for map updates
        if (data.type === "location" && data.lat && data.lng) {
          handleLocation(data.lat, data.lng);
        }

        // Optional future-proofing
        if (data.type === "status" && data.state === "stopped") {
          stopDurationTimer();
          document.getElementById("walkState").innerText = "🔴 Walk stopped";
        }
      };

      ws.onclose = () => {
        stopDurationTimer();
        document.getElementById("walkState").innerText = "🔴 Connection closed";
      };
    }

    function handleLocation(lat, lng) {
      const latlng = [lat, lng];

      // First location = walk start
      if (!startTime) {
        startTime = Date.now();
        document.getElementById("walkState").innerText = "🟢 Walk in progress";
        startDurationTimer();
      }

      if (!map) {
        map = L.map("map").setView(latlng, 16);
        L.tileLayer(
          "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
          { attribution: "© OpenStreetMap" }
        ).addTo(map);

        marker = L.marker(latlng).addTo(map);
        polyline = L.polyline([latlng], { color: "blue" }).addTo(map);
      } else {
        marker.setLatLng(latlng);
        polyline.addLatLng(latlng);
        map.panTo(latlng);
      }

      if (path.length > 0) {
        totalDistance += haversine(path[path.length - 1], latlng);
        document.getElementById("distance").innerText =
          totalDistance.toFixed(2);
      }

      path.push(latlng);
    }

    function startDurationTimer() {
      if (durationTimer) return;

      durationTimer = setInterval(() => {
        const seconds = Math.floor((Date.now() - startTime) / 1000);
        document.getElementById("duration").innerText = seconds;
      }, 1000);
    }

    function stopDurationTimer() {
      if (durationTimer) {
        clearInterval(durationTimer);
        durationTimer = null;
      }
    }

    function haversine(a, b) {
      const R = 6371000;
      const toRad = (x) => (x * Math.PI) / 180;

      const dLat = toRad(b[0] - a[0]);
      const dLng = toRad(b[1] - a[1]);

      const lat1 = toRad(a[0]);
      const lat2 = toRad(b[0]);

      const h =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1) *
          Math.cos(lat2) *
          Math.sin(dLng / 2) ** 2;

      return 2 * R * Math.asin(Math.sqrt(h));
    }
  </script>
</body>
</html>
